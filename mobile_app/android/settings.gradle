pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // Use FLUTTER_ROOT from environment (set by flutter-action on CI)
    def flutterRoot = System.getenv('FLUTTER_ROOT') ?: "C:/Users/DG/flutter"
    includeBuild("${flutterRoot}/packages/flutter_tools/gradle")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://storage.googleapis.com/download.flutter.io"
        }
    }
}

include ":app"

rootProject.name = "gold_news_alert"