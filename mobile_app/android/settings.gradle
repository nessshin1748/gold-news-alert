pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // Use FLUTTER_ROOT from environment (set by flutter-action on CI)
    def flutterRoot = System.getenv('FLUTTER_ROOT')
    println "FLUTTER_ROOT = $flutterRoot"
    if (flutterRoot) {
        def pluginPath = "${flutterRoot}/packages/flutter_tools/gradle"
        println "Including Flutter Gradle Plugin from: $pluginPath"
        includeBuild(pluginPath)
    } else {
        // Fallback for local development
        includeBuild("C:/Users/DG/flutter/packages/flutter_tools/gradle")
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = "https://storage.googleapis.com/download.flutter.io"
        }
    }
}

// Load Flutter plugin modules
def localProperties = new Properties()
def localPropertiesFile = file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def flutterRoot = System.getenv('FLUTTER_ROOT') ?: "C:/Users/DG/flutter"
flutterRoot = localProperties.getProperty("flutter.sdk", flutterRoot)

// Load Flutter app plugin loader which handles plugin module inclusion
apply from: "${flutterRoot}/packages/flutter_tools/gradle/app_plugin_loader.gradle"

include ":app"

rootProject.name = "gold_news_alert"